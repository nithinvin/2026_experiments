<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A match: your team attacks for rounds 1 to 12, swaps sides, defends from round 13, and wins at 13 rounds, with overtime at 12-12">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
  </defs>
  <rect width="900" height="270" fill="#f6f4ee"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">A standard match: first to 13 round wins</text>

  <text x="228" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#c8323a">First half: your team attacks</text>
  <text x="662" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#0f7f73">Second half: your team defends</text>

  <g fill="#efc4c0" stroke="#c8323a" stroke-width="2">
    <rect x="40" y="88" width="28" height="42" rx="4"/><rect x="72" y="88" width="28" height="42" rx="4"/><rect x="104" y="88" width="28" height="42" rx="4"/><rect x="136" y="88" width="28" height="42" rx="4"/><rect x="168" y="88" width="28" height="42" rx="4"/><rect x="200" y="88" width="28" height="42" rx="4"/><rect x="232" y="88" width="28" height="42" rx="4"/><rect x="264" y="88" width="28" height="42" rx="4"/><rect x="296" y="88" width="28" height="42" rx="4"/><rect x="328" y="88" width="28" height="42" rx="4"/><rect x="360" y="88" width="28" height="42" rx="4"/><rect x="392" y="88" width="28" height="42" rx="4"/>
  </g>
  <g fill="#a9d7cf" stroke="#0f7f73" stroke-width="2">
    <rect x="478" y="88" width="28" height="42" rx="4"/><rect x="510" y="88" width="28" height="42" rx="4"/><rect x="542" y="88" width="28" height="42" rx="4"/><rect x="574" y="88" width="28" height="42" rx="4"/><rect x="606" y="88" width="28" height="42" rx="4"/><rect x="638" y="88" width="28" height="42" rx="4"/><rect x="670" y="88" width="28" height="42" rx="4"/><rect x="702" y="88" width="28" height="42" rx="4"/><rect x="734" y="88" width="28" height="42" rx="4"/><rect x="766" y="88" width="28" height="42" rx="4"/><rect x="798" y="88" width="28" height="42" rx="4"/><rect x="830" y="88" width="28" height="42" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#222">
    <text x="54" y="114">1</text><text x="86" y="114">2</text><text x="118" y="114">3</text><text x="150" y="114">4</text><text x="182" y="114">5</text><text x="214" y="114">6</text><text x="246" y="114">7</text><text x="278" y="114">8</text><text x="310" y="114">9</text><text x="342" y="114">10</text><text x="374" y="114">11</text><text x="406" y="114">12</text>
    <text x="492" y="114">13</text><text x="524" y="114">14</text><text x="556" y="114">15</text><text x="588" y="114">16</text><text x="620" y="114">17</text><text x="652" y="114">18</text><text x="684" y="114">19</text><text x="716" y="114">20</text><text x="748" y="114">21</text><text x="780" y="114">22</text><text x="812" y="114">23</text><text x="844" y="114">24</text>
  </g>
  <path d="M426 109H472" stroke="#222" stroke-width="3" marker-end="url(#m)"/>
  <text x="449" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Swap sides</text>
  <text x="449" y="178" text-anchor="middle" font-size="13" fill="#333">Money resets to 800</text>

  <text x="40" y="225" font-size="15" fill="#222">Reach 13 wins and the match ends right away, so most games don't use all 24 rounds.</text>
  <text x="40" y="250" font-size="15" fill="#222">Tied at 12-12? Overtime: a team must get two rounds ahead.</text>
</svg>
